    <script>
        // Frequency Channels Data
        const CHANNELS = [
            { id: 1, name: "CH-01", freq: "446.006" },
            { id: 2, name: "CH-02", freq: "446.018" },
            { id: 3, name: "CH-03", freq: "446.031" },
            { id: 4, name: "CH-04", freq: "446.043" },
            { id: 5, name: "CH-05", freq: "446.056" },
            { id: 6, name: "CH-06", freq: "446.068" },
            { id: 7, name: "CH-07", freq: "446.081" },
            { id: 8, name: "CH-08", freq: "446.093" }
        ];

        // System State Variables
        let isPowerOn = false;
        let currentChannelIdx = 0;
        let volumeLevel = 0.8;
        let isTransmitting = false;
        let isReceiving = false;
        let isSquelchOpen = false;
        let pttToggleMode = false;

        // PeerJS & WebRTC Variables
        let myPeer = null;
        let myPeerId = null;
        let activeCall = null;
        let activeDataConn = null;
        let localMicStream = null;
        let remoteAudioStream = null;

        // Audio Context & Web Audio Synth Nodes
        let audioCtx = null;
        let masterGainNode = null;
        let analyserNode = null;
        let staticNoiseNode = null;
        let staticGainNode = null;

        // Animation Frame
        let animFrameId = null;

        // DOM Elements
        const lcdContainer = document.getElementById('lcdContainer');
        const lcdHeader = document.getElementById('lcdHeader');
        const lcdMyId = document.getElementById('lcdMyId');
        const lcdTargetId = document.getElementById('lcdTargetId');
        const channelName = document.getElementById('channelName');
        const statusText = document.getElementById('statusText');
        const banglaStatus = document.getElementById('banglaStatus');
        const lcdOffMessage = document.getElementById('lcdOffMessage');
        const signalText = document.getElementById('signalText');
        const txLed = document.getElementById('txLed');
        const rxLed = document.getElementById('rxLed');
        const pttButton = document.getElementById('pttButton');
        const volumeKnob = document.getElementById('volumeKnob');
        const knobIndicator = document.getElementById('knobIndicator');
        const powerIcon = document.getElementById('powerIcon');
        const channelKnob = document.getElementById('channelKnob');
        const pairingContainer = document.getElementById('pairingContainer');
        const targetIdInput = document.getElementById('targetIdInput');
        const btnConnect = document.getElementById('btnConnect');
        const remoteAudio = document.getElementById('remoteAudio');
        const visualizerCanvas = document.getElementById('visualizerCanvas');
        const canvasCtx = visualizerCanvas.getContext('2d');
        const volBadge = document.getElementById('volBadge');
        const volVal = document.getElementById('volVal');

        // Control Buttons
        const btnPrevCh = document.getElementById('btnPrevCh');
        const btnNextCh = document.getElementById('btnNextCh');
        const btnStatic = document.getElementById('btnStatic');
        const btnCall = document.getElementById('btnCall');
        const pttModeToggle = document.getElementById('pttModeToggle');
        const pttModeLabel = document.getElementById('pttModeLabel');

        /**
         * Initialize Web Audio Context
         */
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.setValueAtTime(volumeLevel, audioCtx.currentTime);
                masterGainNode.connect(audioCtx.destination);

                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 128;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        /**
         * Synthesize Button Click Tone
         */
        function playClickSound() {
            if (!isPowerOn || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.3 * volumeLevel, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(masterGainNode);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch(e) {}
        }

        /**
         * Synthesize Walkie-Talkie Roger Beeps
         */
        function playPttBeep(isStart) {
            if (!isPowerOn || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';

                if (isStart) {
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.setValueAtTime(1600, now + 0.05);
                    gain.gain.setValueAtTime(0.25 * volumeLevel, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(masterGainNode);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else {
                    // Double tone roger beep
                    osc.frequency.setValueAtTime(1800, now);
                    osc.frequency.setValueAtTime(1200, now + 0.08);
                    gain.gain.setValueAtTime(0.3 * volumeLevel, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                    osc.connect(gain);
                    gain.connect(masterGainNode);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            } catch(e) {}
        }

        /**
         * Synthesize Call Alert Ringing Tone
         */
        function playCallTone() {
            if (!isPowerOn || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(1050, now);
                osc.frequency.setValueAtTime(1400, now + 0.1);
                osc.frequency.setValueAtTime(1050, now + 0.2);
                osc.frequency.setValueAtTime(1400, now + 0.3);

                gain.gain.setValueAtTime(0.35 * volumeLevel, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

                osc.connect(gain);
                gain.connect(masterGainNode);
                osc.start(now);
                osc.stop(now + 0.45);
            } catch(e) {}
        }

        /**
         * Synthesize Radio Static Squelch Noise
         */
        function setStaticNoise(enable, intensity = 0.08) {
            if (!audioCtx) return;

            if (enable && isPowerOn) {
                if (staticNoiseNode) return;

                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.5;
                }

                staticNoiseNode = audioCtx.createBufferSource();
                staticNoiseNode.buffer = buffer;
                staticNoiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1800;
                filter.Q.value = 1.2;

                staticGainNode = audioCtx.createGain();
                staticGainNode.gain.setValueAtTime(intensity * volumeLevel, audioCtx.currentTime);

                staticNoiseNode.connect(filter);
                filter.connect(staticGainNode);
                staticGainNode.connect(masterGainNode);

                staticNoiseNode.start();
            } else {
                if (staticNoiseNode) {
                    try {
                        staticGainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                        setTimeout(() => {
                            if (staticNoiseNode) {
                                staticNoiseNode.stop();
                                staticNoiseNode.disconnect();
                                staticNoiseNode = null;
                                staticGainNode = null;
                            }
                        }, 60);
                    } catch(e) {
                        staticNoiseNode = null;
                    }
                }
            }
        }

        /**
         * Initialize PeerJS Server Connection and generate 4-digit ID
         */
        function initPeerJS() {
            // Generate simple 4-digit code (1000 - 9999)
            const shortId = Math.floor(1000 + Math.random() * 9000).toString();
            myPeerId = shortId;
            
            lcdMyId.innerText = myPeerId;
            statusText.innerText = "CONNECTING PEER...";
            banglaStatus.innerText = "সার্ভারে যুক্ত হচ্ছে...";

            // Create Peer instance
            myPeer = new Peer(myPeerId, {
                debug: 1
            });

            myPeer.on('open', (id) => {
                myPeerId = id;
                lcdMyId.innerText = myPeerId;
                statusText.innerText = "READY - ONLINE";
                banglaStatus.innerText = "অনলাইন প্রস্তুত";
                signalText.innerText = "NET OK";
            });

            // Handle Incoming Data Connections
            myPeer.on('connection', (conn) => {
                activeDataConn = conn;
                setupDataConnectionHandlers(conn);
            });

            // Handle Incoming Media Voice Calls
            myPeer.on('call', async (call) => {
                activeCall = call;
                lcdTargetId.innerText = call.peer;
                
                // Answer call with local silent stream initially
                const stream = await getLocalMicStream();
                call.answer(stream);

                call.on('stream', (remoteStream) => {
                    remoteAudioStream = remoteStream;
                    remoteAudio.srcObject = remoteStream;

                    // Attach Remote Stream to Analyzer for Visualizer
                    if (audioCtx) {
                        const remoteSource = audioCtx.createMediaStreamSource(remoteStream);
                        remoteSource.connect(analyserNode);
                    }
                });

                call.on('close', () => {
                    resetConnectionState();
                });
            });

            myPeer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                statusText.innerText = "PEER ERROR";
                banglaStatus.innerText = "কানেকশন ত্রুটি";
            });
        }

        /**
         * Setup Data Channel Event Handlers (TX Signal, Beeps, Call Tones)
         */
        function setupDataConnectionHandlers(conn) {
            conn.on('open', () => {
                lcdTargetId.innerText = conn.peer;
                statusText.innerText = `CONNECTED: ${conn.peer}`;
                banglaStatus.innerText = `${conn.peer} যুক্ত হয়েছে`;
                playPttBeep(true);
            });

            conn.on('data', (data) => {
                if (data.type === 'TALK_START') {
                    isReceiving = true;
                    rxLed.className = 'w-2.5 h-2.5 rounded-full led-rx';
                    statusText.innerText = `INCOMING TRANSMISSION...`;
                    banglaStatus.innerText = `কথা শুনছেন...`;
                    playPttBeep(true);
                    setStaticNoise(true, 0.03);
                } else if (data.type === 'TALK_STOP') {
                    isReceiving = false;
                    rxLed.className = 'w-2.5 h-2.5 rounded-full led-off';
                    statusText.innerText = `READY - CH 0${CHANNELS[currentChannelIdx].id}`;
                    banglaStatus.innerText = `চ্যানেল প্রস্তুত`;
                    playPttBeep(false);
                    setStaticNoise(false);
                } else if (data.type === 'CALL_TONE') {
                    playCallTone();
                    statusText.innerText = `CALL ALERT FROM ${conn.peer}`;
                    banglaStatus.innerText = `কল সতর্কতা এসেছে`;
                }
            });

            conn.on('close', () => {
                resetConnectionState();
            });
        }

        /**
         * Connect to Remote Peer Device by ID
         */
        async function connectToPeer(remoteId) {
            if (!myPeer || !isPowerOn) return;
            
            statusText.innerText = `CALLING ${remoteId}...`;
            banglaStatus.innerText = `কল করা হচ্ছে...`;

            // Data Connection
            activeDataConn = myPeer.connect(remoteId);
            setupDataConnectionHandlers(activeDataConn);

            // Media Call Connection
            const stream = await getLocalMicStream();
            activeCall = myPeer.call(remoteId, stream);
            lcdTargetId.innerText = remoteId;

            activeCall.on('stream', (remoteStream) => {
                remoteAudioStream = remoteStream;
                remoteAudio.srcObject = remoteStream;

                if (audioCtx) {
                    const remoteSource = audioCtx.createMediaStreamSource(remoteStream);
                    remoteSource.connect(analyserNode);
                }
            });

            activeCall.on('close', () => {
                resetConnectionState();
            });
        }

        /**
         * Get Local Microphone Audio Stream
         */
        async function getLocalMicStream() {
            if (localMicStream) return localMicStream;
            try {
                localMicStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: true 
                    } 
                });
                // Mute mic by default until PTT is held
                localMicStream.getAudioTracks().forEach(track => track.enabled = false);
                return localMicStream;
            } catch (err) {
                console.error("Mic Access Error:", err);
                statusText.innerText = "MIC PERMISSION DENIED";
                banglaStatus.innerText = "মাইক পারমিশন দিন";
                return null;
            }
        }

        /**
         * Reset Connection State
         */
        function resetConnectionState() {
            lcdTargetId.innerText = "NONE";
            statusText.innerText = `READY - ONLINE`;
            banglaStatus.innerText = `অনলাইন প্রস্তুত`;
            rxLed.className = 'w-2.5 h-2.5 rounded-full led-off';
            txLed.className = 'w-2.5 h-2.5 rounded-full led-off';
            setStaticNoise(false);
            isReceiving = false;
            isTransmitting = false;
        }

        /**
         * Draw Realtime Audio Waveform Visualizer
         */
        function drawVisualizer() {
            if (!isPowerOn) {
                canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                return;
            }

            animFrameId = requestAnimationFrame(drawVisualizer);

            const width = visualizerCanvas.width;
            const height = visualizerCanvas.height;
            canvasCtx.clearRect(0, 0, width, height);

            if ((isTransmitting || isReceiving) && analyserNode) {
                // Live Voice Waveform
                const bufferLength = analyserNode.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyserNode.getByteTimeDomainData(dataArray);

                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = isTransmitting ? '#ef4444' : '#4ade80';
                canvasCtx.beginPath();

                const sliceWidth = width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = (v * height) / 2;

                    if (i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                }
                canvasCtx.lineTo(width, height / 2);
                canvasCtx.stroke();

            } else if (isSquelchOpen) {
                // Static Noise Equalizer Bars
                canvasCtx.fillStyle = '#facc15';
                const barWidth = 6;
                let posX = 4;
                while (posX < width) {
                    const randomHeight = Math.random() * (height - 4);
                    canvasCtx.fillRect(posX, (height - randomHeight) / 2, barWidth - 2, randomHeight);
                    posX += barWidth;
                }
            } else {
                // Idle Sine Wave
                canvasCtx.lineWidth = 1.5;
                canvasCtx.strokeStyle = 'rgba(74, 222, 128, 0.4)';
                canvasCtx.beginPath();
                const time = Date.now() * 0.003;
                for (let x = 0; x < width; x++) {
                    const y = height / 2 + Math.sin(x * 0.05 + time) * 3;
                    if (x === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);
                }
                canvasCtx.stroke();
            }
        }

        /**
         * Power Toggle Handler
         */
        function togglePower() {
            initAudioContext();
            isPowerOn = !isPowerOn;

            if (isPowerOn) {
                powerIcon.className = 'fa-solid fa-power-off text-xs text-emerald-400';
                
                lcdContainer.classList.remove('lcd-screen-off');
                lcdContainer.classList.add('lcd-screen-on');
                
                lcdHeader.classList.remove('opacity-40');
                lcdHeader.classList.add('opacity-100');

                lcdMyId.className = 'text-3xl font-lcd font-extrabold text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]';
                lcdTargetId.className = 'text-lg font-lcd font-bold text-emerald-300';
                statusText.className = 'text-emerald-400 font-bold uppercase tracking-wider';
                banglaStatus.className = 'text-emerald-300 text-[11px] font-semibold';

                lcdOffMessage.classList.add('hidden');
                pairingContainer.classList.remove('opacity-50', 'pointer-events-none');

                // Initialize WebRTC
                initPeerJS();

                visualizerCanvas.width = visualizerCanvas.offsetWidth;
                visualizerCanvas.height = visualizerCanvas.offsetHeight;
                drawVisualizer();

            } else {
                // Power Off
                if (isTransmitting) stopTransmission();
                if (myPeer) { myPeer.destroy(); myPeer = null; }

                powerIcon.className = 'fa-solid fa-power-off text-xs text-slate-600';
                lcdContainer.classList.remove('lcd-screen-on');
                lcdContainer.classList.add('lcd-screen-off');

                lcdHeader.classList.remove('opacity-100');
                lcdHeader.classList.add('opacity-40');

                lcdMyId.className = 'text-3xl font-lcd font-extrabold text-emerald-950 transition-colors';
                lcdTargetId.className = 'text-lg font-lcd font-bold text-emerald-950';
                statusText.className = 'text-emerald-950 font-bold uppercase tracking-wider';
                banglaStatus.className = 'text-emerald-950 text-[11px] font-semibold';

                lcdMyId.innerText = "----";
                lcdTargetId.innerText = "NONE";
                statusText.innerText = "SYSTEM OFF";
                banglaStatus.innerText = "বন্ধ আছে";

                lcdOffMessage.classList.remove('hidden');
                pairingContainer.classList.add('opacity-50', 'pointer-events-none');

                txLed.className = 'w-2.5 h-2.5 rounded-full led-off';
                rxLed.className = 'w-2.5 h-2.5 rounded-full led-off';

                if (animFrameId) cancelAnimationFrame(animFrameId);
                canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            }
        }

        /**
         * Start Transmission (PTT Down)
         */
        async function startTransmission() {
            if (!isPowerOn || isTransmitting) return;
            initAudioContext();

            const stream = await getLocalMicStream();
            if (stream) {
                // Enable Microphone Track for WebRTC call
                stream.getAudioTracks().forEach(track => track.enabled = true);
                
                // Connect Local Mic to Visualizer Analyser
                const micSource = audioCtx.createMediaStreamSource(stream);
                micSource.connect(analyserNode);
            }

            isTransmitting = true;
            pttButton.classList.add('pressed');
            
            txLed.className = 'w-2.5 h-2.5 rounded-full led-tx';
            statusText.innerText = "TRANSMITTING...";
            banglaStatus.innerText = "কথা বলছেন...";

            playPttBeep(true);
            setStaticNoise(true, 0.02);

            // Send Signal over Data Channel to remote peer
            if (activeDataConn && activeDataConn.open) {
                activeDataConn.send({ type: 'TALK_START' });
            }
        }

        /**
         * Stop Transmission (PTT Up)
         */
        function stopTransmission() {
            if (!isTransmitting) return;
            isTransmitting = false;
            pttButton.classList.remove('pressed');

            if (localMicStream) {
                // Mute Mic Track
                localMicStream.getAudioTracks().forEach(track => track.enabled = false);
            }

            setStaticNoise(false);

            if (isPowerOn) {
                txLed.className = 'w-2.5 h-2.5 rounded-full led-off';
                playPttBeep(false);

                statusText.innerText = activeDataConn ? `CONNECTED` : `READY - ONLINE`;
                banglaStatus.innerText = activeDataConn ? `সংযুক্ত আছে` : `অনলাইন প্রস্তুত`;
            }

            if (activeDataConn && activeDataConn.open) {
                activeDataConn.send({ type: 'TALK_STOP' });
            }
        }

        // Event Listeners for Power & Knobs
        volumeKnob.addEventListener('click', () => {
            togglePower();
            playClickSound();
        });

        volumeKnob.addEventListener('wheel', (e) => {
            e.preventDefault();
            initAudioContext();
            
            if (e.deltaY < 0) volumeLevel = Math.min(1.0, volumeLevel + 0.05);
            else volumeLevel = Math.max(0.0, volumeLevel - 0.05);

            if (masterGainNode) masterGainNode.gain.setValueAtTime(volumeLevel, audioCtx.currentTime);

            const currentVolAngle = -120 + (volumeLevel * 240);
            knobIndicator.style.transform = `translateX(-50%) rotate(${currentVolAngle}deg)`;

            volVal.innerText = `${Math.round(volumeLevel * 100)}%`;
            volBadge.classList.remove('opacity-0');
            clearTimeout(window.volTimeout);
            window.volTimeout = setTimeout(() => volBadge.classList.add('opacity-0'), 1200);
        });

        // Channel Knob Switch
        channelKnob.addEventListener('click', () => {
            if (!isPowerOn) return;
            playClickSound();
            currentChannelIdx = (currentChannelIdx + 1) % CHANNELS.length;
            channelName.innerText = CHANNELS[currentChannelIdx].name;
            const rotation = (currentChannelIdx / (CHANNELS.length - 1)) * 180 - 90;
            channelKnob.style.transform = `rotate(${rotation}deg)`;
        });

        btnPrevCh.addEventListener('click', () => {
            if (!isPowerOn) return;
            playClickSound();
            currentChannelIdx = (currentChannelIdx - 1 + CHANNELS.length) % CHANNELS.length;
            channelName.innerText = CHANNELS[currentChannelIdx].name;
        });

        btnNextCh.addEventListener('click', () => {
            if (!isPowerOn) return;
            playClickSound();
            currentChannelIdx = (currentChannelIdx + 1) % CHANNELS.length;
            channelName.innerText = CHANNELS[currentChannelIdx].name;
        });

        // WebRTC Manual Pair Button
        btnConnect.addEventListener('click', () => {
            const targetId = targetIdInput.value.trim();
            if (targetId && targetId !== myPeerId) {
                connectToPeer(targetId);
            }
        });

        // Call Tone & Squelch Controls
        btnCall.addEventListener('click', () => {
            if (!isPowerOn) return;
            playCallTone();
            if (activeDataConn && activeDataConn.open) {
                activeDataConn.send({ type: 'CALL_TONE' });
            }
        });

        btnStatic.addEventListener('click', () => {
            if (!isPowerOn) return;
            isSquelchOpen = !isSquelchOpen;
            playClickSound();
            if (isSquelchOpen) {
                btnStatic.classList.add('bg-amber-600', 'text-white');
                setStaticNoise(true, 0.15);
            } else {
                btnStatic.classList.remove('bg-amber-600', 'text-white');
                setStaticNoise(false);
            }
        });

        // PTT Toggle Mode
        pttModeToggle.addEventListener('change', (e) => {
            pttToggleMode = e.target.checked;
            pttModeLabel.innerText = pttToggleMode ? "Toggle" : "Hold";
            if (isTransmitting) stopTransmission();
        });

        // Touch & Mouse Events for PTT
        pttButton.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (pttToggleMode) {
                if (isTransmitting) stopTransmission();
                else startTransmission();
            } else {
                startTransmission();
            }
        });

        window.addEventListener('mouseup', () => {
            if (!pttToggleMode && isTransmitting) stopTransmission();
        });

        pttButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (pttToggleMode) {
                if (isTransmitting) stopTransmission();
                else startTransmission();
            } else {
                startTransmission();
            }
        });

        pttButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!pttToggleMode && isTransmitting) stopTransmission();
        });

        // Spacebar PTT Shortcut
        let isSpacePressed = false;
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isSpacePressed && !e.repeat) {
                isSpacePressed = true;
                if (pttToggleMode) {
                    if (isTransmitting) stopTransmission();
                    else startTransmission();
                } else {
                    startTransmission();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                if (!pttToggleMode && isTransmitting) stopTransmission();
            }
        });
    </script>
